# FluxSBC - HAProxy para MySQL/Galera
# Instalado por flux_install.sh como /etc/haproxy/haproxy.cfg
# Os marcadores FLUX_* sao substituidos durante a instalacao.

global
    log /dev/log local0
    maxconn 8000
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option tcpka
    option clitcpka
    option srvtcpka
    retries 3
    timeout connect 3s
    timeout client 620s
    timeout server 620s
    timeout check 2s
    default-server inter 2s rise 2 fall 2 on-marked-down shutdown-sessions

frontend fluxdb_write
    bind __FLUX_DB_WRITE_BIND__
    default_backend galera_write

frontend fluxdb_read
    bind __FLUX_DB_READ_BIND__
    default_backend galera_read

backend galera_write
    balance first
    __FLUX_DB_CHECK_OPTION__
__FLUX_DB_WRITE_SERVERS__

backend galera_read
    balance leastconn
    __FLUX_DB_CHECK_OPTION__
__FLUX_DB_READ_SERVERS__

listen fluxdb_stats
    bind __FLUX_DB_STATS_BIND__
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats show-node
