# FluxSBC - HAProxy para MySQL
# Instalado como /etc/haproxy/haproxy.cfg por flux_install.sh ou flux_ha_setup.sh
# Os marcadores FLUX_* sao substituidos durante a instalacao.
#
# O estado de cada no e decidido pelo agente flux-dbcheck (porta 9200):
#   /write  200 apenas se o no aceita escrita (read_only=OFF)
#   /read   200 apenas se o no serve leitura com atraso aceitavel
# E isso que permite manter uma replica declarada no pool de escrita:
# ela fica DOWN ate ser promovida.

global
    log /dev/log local0
    maxconn 8000
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option tcpka
    option clitcpka
    option srvtcpka
    retries 3
    timeout connect 3s
    timeout client 620s
    timeout server 620s
    timeout check 2s
    default-server inter 2s rise 2 fall 2 on-marked-down shutdown-sessions

frontend fluxdb_write
    bind __FLUX_DB_WRITE_BIND__
    default_backend fluxdb_write_pool

frontend fluxdb_read
    bind __FLUX_DB_READ_BIND__
    default_backend fluxdb_read_pool

backend fluxdb_write_pool
    balance first
    option httpchk GET /write
    http-check expect status 200
__FLUX_DB_WRITE_SERVERS__

backend fluxdb_read_pool
    balance leastconn
    option httpchk GET /read
    http-check expect status 200
__FLUX_DB_READ_SERVERS__

listen fluxdb_stats
    bind __FLUX_DB_STATS_BIND__
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats show-node
